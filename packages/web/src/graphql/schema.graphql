"""
A series of recurring games — Florie, Zlenice, Bezkrálí and the like. Each
instalment stays a full game row (its ratings, comments and play states are its
own); the series is the relationship that groups them, with aggregate numbers
over all instalments. A series with fewer than two visible instalments is an
editing state, not a data error — the panel simply renders it honestly.
"""
type Series {
    id: ID!
    name: String
    description: String
    "All instalments of the series, oldest first; soft-deleted games hidden (editors and admins see them)."
    games: [Game!]!
    "Instalment count shown to this viewer (see `games`)."
    amountOfGames: Int!
    "Ratings summed over all instalments."
    amountOfRatings: Int!
    "Players summed over all instalments."
    amountOfPlayed: Int!
    "Comments summed over all instalments."
    amountOfComments: Int!
    "First instalment year, null when no instalment carries a year."
    firstYear: Int
    "Latest instalment year, null when no instalment carries a year."
    lastYear: Int
    added: String!
}

