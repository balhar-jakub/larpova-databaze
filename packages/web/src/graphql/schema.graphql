"""
Year-by-year history of the database's content, the data behind the statistics
page. All series share one row per calendar year, so one query fetches the whole
page.

Honesty of the data, because two one-off imports would otherwise read as
explosions of activity:

- `events` counts *unique* events — the same name with the same start date is
  one event, however many duplicate rows the calendar holds. `eventsRaw` is
  every live row, so the UI can show the duplicates instead of hiding them
  (2022 holds 1 130 rows for 110 unique events).
- `importedRatings` are the votes that arrived in the 2014 one-time import
  (all `csld_rating.added` on 2014-06-01): they count towards `ratings`, but
  the UI draws them separately, and `averageRating` includes them — the mean
  of the era is the mean of what the database held.
- A game's year here is the year its *rating was added* (`csld_rating.added`),
  not the year the event ran: the legacy rows carry no playable event date.
"""
type Statistics {
    gamesTotal: Int!
    "Unique live events across all years."
    eventsTotal: Int!
    ratingsTotal: Int!
    commentsTotal: Int!
    "One row per calendar year that has any activity, ascending."
    years: [StatsYear!]!
}

type StatsYear {
    year: Int!
    "Unique live events started in this year."
    events: Int!
    "All live event rows started in this year, duplicates included."
    eventsRaw: Int!
    "Games whose record was added in this year."
    newGames: Int!
    "Ratings (votes) added in this year, import included."
    ratings: Int!
    "Of which arrived in the 2014-06-01 import."
    importedRatings: Int!
    "Average rating of the votes added in this year; null when none."
    averageRating: Float
    "Vote counts per recommendation band, [9-10, 7-8, 5-6, 3-4, 1-2]."
    bands: [Int!]!
    "Games with the most votes added in this year, best first."
    topGames: [StatsTopGame!]!
}

type StatsTopGame {
    game: Game!
    "Votes this game received in this year."
    votesInYear: Int!
    "Average of those votes; null when the game's year had none."
    averageInYear: Float
}

"""
The content yearbook of one calendar year — what the community talked about,
not just the numbers (those live in `statistics`). Games are ranked by the
value votes they received in the year; quotes are one comment per game, the
most substantial ones; `newGames` is everything added to the catalog in the
year, oldest first. All the honesty rules (value votes only, hidden comments
excluded, soft-deleted games dropped) are applied by the resolver.
"""
type YearReview {
    year: Int!
    "Up to 3 most-discussed games, big cards with cover, labels and authors."
    featuredGames: [YearReviewGame!]!
    "The next 7 of the ranked games, small rows."
    runnerUpGames: [YearReviewGame!]!
    "Every game added to the catalog in the year, oldest first."
    newGames: [Game!]!
    "One comment per ranked game — the year's most substantial reviews."
    quotes: [YearReviewQuote!]!
    "Czech larp articles published in the year, newest first."
    articles: [YearReviewArticle!]!
}

"A ranked game of the year: the game plus how the community judged it in the year."
type YearReviewGame {
    game: Game!
    "Value votes this game received in the year."
    votesInYear: Int!
    "Average of those votes."
    averageInYear: Float!
}

"""
A quote from a review written in the year. The user is the comment's author;
their `image` is nulled when the picture is the legacy default avatar, so the
UI shows its own placeholder instead of the old blue silhouette.
"""
type YearReviewQuote {
    id: ID!
    "Plain-text excerpt of the comment, HTML stripped and entities decoded."
    text: String
    added: String
    user: User
    game: Game
}

"An article of the year — metadata and an external link, same fields as `Article`."
type YearReviewArticle {
    id: ID!
    source: String!
    url: String!
    title: String!
    perex: String
    authors: String
    publishedAt: String
    categories: [String!]!
    imageUrl: String
}
