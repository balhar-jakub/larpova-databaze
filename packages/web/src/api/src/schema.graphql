type Query {
    homepage: HomepageQuery!
    loggedInUser: User
    gameById(gameId: ID!): Game
    groupById(groupId: ID!): Group
    groupsByQuery(query: String!, offset: Int, limit: Int): [Group!]!
    eventById(eventId: ID!): Event
    eventCalendar(offset: Int, limit: Int, from: String, to: String, requiredLabels: [ID!], otherLabels: [ID!], query: String): EventsPaged!
    eventCalendarStats(from: String, to: String): EventCalendarStats!
    "Events matching a text query (name and place, diacritics ignored, word prefixes matched)."
    eventsByQuery(query: String!, offset: Int, limit: Int, from: String, to: String): EventsPaged!
    "Everything matching a text query at once — what the header search field shows."
    search(query: String!, limit: Int): SearchResults!
    userById(userId: ID!): User
    userByEmail(email: String!): User
    usersByQuery(query: String!, offset: Int, limit: Int): [User!]!
    "Same order as `usersByQuery`, with the honest total for the pager."
    usersByQueryWithTotal(query: String!, offset: Int, limit: Int): UsersPaged!
    games: GamesQuery!
    authorizedRequiredLabels: [Label!]!
    authorizedOptionalLabels: [Label!]!
    admin: AdminQuery!
    donations: [Donation!]!
    config: Config!
}

type UsersPaged {
    users: [User!]!
    totalAmount: Int!
    "A corrected query to offer when nothing was found (`Mysleli jste…?`)."
    suggestion: String
}

type SearchResults {
    games: [Game!]!
    users: [User!]!
    events: [Event!]!
    groups: [Group!]!
    totalGames: Int!
    totalUsers: Int!
    totalEvents: Int!
    totalGroups: Int!
    suggestion: String
}

type Mutation {
    user: UserMutation!
    game: GameMutation!
    group: GroupMutation!
    event: EventMutation!
    admin: AdminMutation!
}

"""
The homepage of the anonymous visitor, in one round trip: the blocks someone
sees before they have an account. The old popularity block is gone — it sorted
on `total_rating`, which is NULL for the four most visited games (PostgreSQL
sorts NULLs first), so four unrated games led the block.
"""
type HomepageQuery {
    "The newest games in the catalog."
    lastAddedGames: [Game!]!
    "The best rated games; only games with at least 5 ratings get in."
    bestRatedGames: [Game!]!
    "The most used labels with their game counts — the homepage tiles."
    topLabels: [GameCatalogLabelFacet!]!
    "What the database holds, for the hero line."
    stats: HomepageStats!
    lastComments(offset: Int, limit: Int): [Comment!]!
    nextEvents: [Event!]!
    "The signed-in visitor's own blocks; null for an anonymous visitor."
    myHome: MyHomepage
}

type HomepageStats {
    games: Int!
    events: Int!
    upcomingEvents: Int!
    users: Int!
    labels: Int!
}
"""
The signed-in visitor's own page: what they have, what to finish, what to play
next. Null for an anonymous caller — the anonymous blocks are `HomepageQuery`
itself.
"""
type MyHomepage {
    playedCount: Int!
    wantedCount: Int!
    authoredCount: Int!
    commentsCount: Int!
    "False when the account has nothing in the database; the page shows the first steps instead."
    hasData: Boolean!
    "Upcoming events of the games in the visitor's \"want to play\" list."
    myEvents: [Event!]!
    "Wanted games with no event ahead — why the calendar keeps an ICS feed."
    wantedWithoutEvent: Int!
    "Played games the visitor has not rated, newest first."
    toRate: [PersonalGame!]!
    "The oldest rows of the \"want to play\" list."
    oldestWanted: [PersonalGame!]!
    "The visitor's own games, the newest rating first."
    authored: [AuthoredGame!]!
    "Labels of the games the visitor rated 8 or more, with how often they occur."
    recommendedLabels: [LabelCount!]!
    "Games recommended through those labels, in the catalog's own order."
    recommended: [Game!]!
}

"A game with the date the visitor's own row about it was written."
type PersonalGame {
    game: Game!
    since: String
}

"One of the visitor's games with the newest rating it received."
type AuthoredGame {
    game: Game!
    lastRating: LastRating
}

"The newest rating a game received, as its author sees it."
type LastRating {
    rating: Int!
    added: String
    user: User
}

"A label with the number of times it occurs in the visitor's own ratings."
type LabelCount {
    id: ID!
    name: String
    count: Int!
}


type GamesQuery {
    byQuery(query: String!, offset: Int, limit: Int): [Game!]!
    byQueryWithTotal(query: String!, offset: Int, limit: Int): GamesPaged!
    ladder(ladderType: LadderType!, offset: Int, limit: Int, requiredLabels: [ID!], otherLabels: [ID!]): GamesPaged!
    "Browsable catalog with filters and facet counts — the replacement for the ladder tabs."
    catalog(filter: GameCatalogFilter, order: GameCatalogOrder, offset: Int, limit: Int): GameCatalogPaged!
}

enum LadderType {
    RecentAndMostPlayed,
    MostPlayed,
    Recent,
    Best,
    MostCommented,
}

enum GameCatalogOrder {
    "Bayesian average: well rated games with few ratings do not outrank proven classics."
    Recommended
    "How well `filter.query` matches (exact name, name start, word starts, substring) — the ranking of the shared search engine. Without a query it falls back to `Recommended`."
    Relevance
    "Average rating, unrated games last."
    Best
    "Games people marked as played."
    MostPlayed
    "Newest first."
    Newest
    "Most commented first."
    MostCommented
    "Alphabetically."
    NameAsc
}

input GameCatalogFilter {
    query: String
    "Games of these authors (the 'hry od X' link of a search result)."
    authorIds: [ID!]
    "Games that have all of these labels."
    allLabels: [ID!]
    "Games that have at least one of these labels."
    anyLabels: [ID!]
    "Games that have none of these labels."
    noLabels: [ID!]
    "Duration buckets: short, day, weekend, long."
    durations: [String!]
    yearFrom: Int
    yearTo: Int
    playersFrom: Int
    playersTo: Int
    "Minimum average rating, 0-100 (80 and up is 'recommended')."
    minRating: Float
    "Minimum number of ratings."
    minRatings: Int
    withComments: Boolean
    withImage: Boolean
    addedWithinDays: Int
}

type GameCatalogLabelFacet {
    id: ID!
    name: String
    count: Int!
    isRequired: Boolean!
}

type GameCatalogCount {
    key: String!
    count: Int!
}

type GameCatalogFacets {
    labels: [GameCatalogLabelFacet!]!
    durations: [GameCatalogCount!]!
    yearMin: Int
    yearMax: Int
}

type GameCatalogPaged {
    games: [Game!]!
    totalAmount: Int!
    facets: GameCatalogFacets!
}

type Game {
    id: ID!
    name: String
    description: String
    year: Int
    web: String
    hours: Int
    days: Int
    players: Int
    menRole: Int
    womenRole: Int
    bothRole: Int
    totalRating: Float!
    averageRating: Float!
    added: String!
    amountOfComments: Int!
    amountOfPlayed: Int!
    amountOfRatings: Int!
    galleryURL: String
    photoAuthor: String
    deleted: Boolean
    ratingsDisabled: Boolean
    commentsDisabled: Boolean
    labels: [Label!]!
    currentUsersComment: Comment
    currentUsersRating: Rating
    comments: [Comment!]!
    commentsPaged(offset: Int!, limit: Int!): CommentsPaged!
    authors: [User!]!
    groupAuthor: [Group!]!
    ratings: [Rating!]!
    ratingStats: [RatingCount!]!
    wantsToPlay: [User!]!
    similarGames: [Game!]!
    gamesOfAuthors: [Game!]!
    events: [Event!]!
    video: Video
    coverImage: Image
    photos: [Photo!]!
    allowedActions: [AllowedAction!]
}

type CommentsPaged {
    comments: [Comment!]!
    totalAmount: Int!
}

type GamesPaged {
    games: [Game!]!
    totalAmount: Int!
    "A corrected query to offer when nothing was found (`Mysleli jste…?`)."
    suggestion: String
}

type Event {
    id: ID!
    name: String
    description: String
    loc: String
    web: String
    registrationUrl: String
    registrationOpen: Boolean!
    deleted: Boolean
    amountOfPlayers: Int
    from: String
    to: String
    location: EventLocation
    labels: [Label!]
    games: [Game!]
    allowedActions: [AllowedAction!]
    "Cover image uploaded for this event; falls back to the cover image of a linked game when the event has none of its own."
    coverImage: Image
