    amountOfComments: Int
    amountOfPlayed: Int
    amountOfCreated: Int
    image: Image
    commentsPaged(offset: Int!, limit: Int!): CommentsPaged!
    ratings: [Rating!]!
    playedGames: [GameWithRating!]!
    wantedGames: [Game!]!
    authoredGames: [Game!]!
    name: String!
    description: String
    email: String
    nickname: String
    birthDate: String
