type UserMutation {
    logIn(userName: String!, password: String!): User
    logOut: User
    createUser(input: CreateUserInput!): User
    updateLoggedInUser(input: UpdateLoggedInUserInput!): User!
    updateLoggedInUserPassword(oldPassword: String!, newPassword: String!): User!
    startRecoverPassword(email: String!, recoverUrl: String!): Boolean
    finishRecoverPassword(token: String!, newPassword: String!): User
    startEmailLogin(email: String!, loginUrlTemplate: String!): Boolean!
}

input CreateUserInput {
    email: String!
    password: String!
    profilePicture: UploadedFileInput
    name: String!
    nickname: String
    birthDate: String
    city: String
    gender: Gender
    recaptcha: String!
}

input UpdateLoggedInUserInput {
    email: String!
    profilePicture: UploadedFileInput
    name: String!
    nickname: String
    birthDate: String
    city: String
    "Short public bio shown on the user's profile."
