type AdminQuery {
    allLabels: [Label!]!
    allUsers: [User!]!
    stats: [StatFact!]!
    selfRated: [SelfRated!]!
}

type StatFact {
    id: ID!
    year: Int!
    month: Int!
    numRatings: Int
    averageRating: Float
    numComments: Int
}

type SelfRated {
    id: ID!
    user: User!
    game: Game!
}

type AdminMutation {
    updateLabel(input: UpdateLabelInput!): Label!
    setLabelRequired(labelId: ID!, required: Boolean!): Label!
    setLabelAuthorized(labelId: ID!, authorized: Boolean!): Label!
    deleteLabel(labelId: ID!): Label
    setUserRole(userId: ID!, role: UserRoleIn!): User!
    deleteUser(userId: ID!): User
}

enum UserRole {
    USER,
    EDITOR,
    ADMIN,
    AUTHOR,
    ANONYMOUS
}

enum UserRoleIn {
    USER,
    EDITOR,
    ADMIN
}

enum Gender {
    "Not stated — the wording falls back to the neutral form (`Hrál/a jsem`)."
    UNSPECIFIED
    MALE
    FEMALE
}


input UpdateLabelInput {
    id: ID!
    name: String!
    description: String
}

type Donation {
    amount: Float!
    donor: String
    description: String
}

type Config {
    reCaptchaKey: String!
}

input CreateGroupInput {
    name: String!
}

input UpdateGroupInput {
    id: ID!
    name: String!
}

enum AllowedAction {
    Edit,
    Delete
}

type EventsPaged {
    events: [Event!]!
    totalAmount: Int!
    "A corrected query to offer when nothing was found (`Mysleli jste…?`)."
    suggestion: String
    "Rows with the same name, start and end form one cluster; how many events the cluster holds (clusters of 2+ only)."
    duplicates: [EventDuplicate!]!
}

type EventDuplicate {
    eventId: ID!
    count: Int!
}

type EventCalendarStats {
    totalAmount: Int!
    byMonth: [EventCalendarMonthCount!]!
}

type EventCalendarMonthCount {
    year: Int!
    month: Int!
    count: Int!
}
