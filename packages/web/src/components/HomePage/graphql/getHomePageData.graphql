#import "./fragments.graphql"
#import "src/graphql/fragments/baseGameData.graphql"

query GetHomePageData {
    homepage {
        # What the anonymous visitor sees: the newest games, the best rated ones,
        # the label tiles and the upcoming events — the whole page in one request.
        lastAddedGames {
            ...baseGameData
        }
        bestRatedGames {
            ...baseGameData
        }
        nextEvents {
            id
            name
            from
            to
            loc
            amountOfPlayers
        }
        lastComments {
            ...baseCommentData
        }
        topLabels {
            id
            name
            count
            isRequired
        }
        stats {
            games
            events
            upcomingEvents
            users
            labels
        }
    }
}
