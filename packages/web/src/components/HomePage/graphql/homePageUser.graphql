#import "src/graphql/fragments/baseGameData.graphql"

query GetHomePageUser {
    homepage {
        # The visitor's own blocks. `hasData` is false for the third of the
        # accounts with nothing in the database: then the page shows the
        # anonymous content (the blocks below) behind a "first steps" band.
        myHome {
            playedCount
            wantedCount
            authoredCount
            commentsCount
            hasData
            wantedWithoutEvent
            myEvents {
                id
                name
                from
                to
                loc
                amountOfPlayers
                registrationUrl
                registrationOpen
                games {
                    ...baseGameData
                }
            }
            toRate {
                game {
                    ...baseGameData
                }
                since
            }
            toComment {
                game {
                    ...baseGameData
                }
                since
            }
            oldestWanted {
                game {
                    ...baseGameData
                }
                since
            }
            authored {
                game {
                    ...baseGameData
                }
                lastRating {
                    rating
                    added
                }
            }
            authoredComments {
                id
                commentAsText
                added
                user {
                    id
                    name
                    nickname
                }
                game {
                    ...baseGameData
                }
            }
            recommendedLabels {
                id
                name
                count
            }
            recommended {
                ...baseGameData
            }
            recommendedEvents {
                id
                name
                from
                to
                loc
                registrationUrl
                registrationOpen
                matchedLabels
                games {
                    ...baseGameData
                }
            }
        }
        # The empty state (and the anonymous page) read these.
        bestRatedGames {
            ...baseGameData
        }
        lastAddedGames {
            ...baseGameData
        }
        recentGames {
            game {
                ...baseGameData
            }
            event {
                id
                name
                from
                to
                loc
                amountOfPlayers
            }
        }
        openRegistrationEvents {
            id
            name
            from
            to
            loc
            amountOfPlayers
            registrationUrl
            registrationOpen
        }
        nextEvents {
            id
            name
            from
            to
            loc
            amountOfPlayers
        }
        stats {
            games
            events
            upcomingEvents
            users
            labels
        }
        topLabels {
            id
            name
            count
            isRequired
        }
    }
}
