query GameDetail($gameId: ID!) {
    gameById(gameId: $gameId) {
        id
        name
        players
        menRole
        womenRole
        bothRole
        hours
        days
        year
        web
        galleryURL
        photoAuthor
        description
        deleted
        averageRating
        amountOfRatings
        amountOfPlayed
        commentsDisabled
        ratingsDisabled
        coverImage {
            id
        }
        currentUsersRating {
            id
            rating
            state
        }
        labels {
            id
            name
            description
            isRequired
        }
        ratingStats {
            count
            rating
        }
        video {
            id
            path
        }
        authors {
            id
            name
            nickname
        }
        groupAuthor {
            id
            name
        }
        similarGames {
            id
            name
            averageRating
            amountOfRatings
            year
        }
        gamesOfAuthors {
            id
            name
            averageRating
            amountOfRatings
            year
        }
        articles {
            id
            url
            title
            source
            publishedAt
        }
        events {
            id
            name
            from
            to
        }
        series {
            id
            name
            description
            amountOfGames
            amountOfRatings
            amountOfPlayed
            firstYear
            lastYear
            games {
                id
                name
                year
                averageRating
                amountOfRatings
            }
        }
        allowedActions
        ratings {
            id
            rating
            user {
                id
                name
            }
        }
    }
}