#import '../../../graphql/fragments/baseGameData.graphql'

fragment userProfileData on User {
    id
    amountOfPlayed
    amountOfCreated
    image {
        id
    }
    name
    nickname
    birthDate
    city
    description
    authoredGames {
        ...baseGameData
    }
    playedGames {
        game {
            ...baseGameData
            year
        }
        rating
    }
    wantedGames {
        ...baseGameData
        year
    }
}