query AllCommentsPage($offset: Int, $limit: Int, $length: CommentLength, $year: Int) {
    allComments(offset: $offset, limit: $limit, length: $length, year: $year) {
        totalAmount
        comments {
            id
            added
            amountOfUpvotes
            comment
            isHidden
            user {
                id
                name
                nickname
                image {
                    id
                }
            }
            game {
                id
                name
                averageRating
                amountOfRatings
            }
        }
    }
    commentsStats {
        lengths {
            SHORT
            MEDIUM
            LONG
        }
        years {
            year
            amount
        }
    }
}
