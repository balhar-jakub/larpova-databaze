#import "src/graphql/fragments/authorizedLabels.graphql"

query LoadGameForEdit($gameId: ID!) {
    gameById(gameId: $gameId) {
        id
        name
        description
        authors {
            id
            name
            nickname
        }
        groupAuthor {
            id
            name
        }
        year
        players
        womenRole
        menRole
        bothRole
        hours
        days
        web
        photoAuthor
        galleryURL
        video {
            id
            path
        }
        ratingsDisabled
        commentsDisabled
        series {
            id
            name
            amountOfGames
        }
        labels {
            id
            isRequired
        }
    }
    ...authorizedLabels
}
