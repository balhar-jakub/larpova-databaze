# The whole statistics page in one query: KPI totals plus every per-year
# series the charts draw. One round trip, no pagination — the series cover
# ~15 years. The per-year top games used to feed the "Hry roku" cards here;
# that section is now the "Ročenky" links and needs no per-game data.
query StatisticsPage {
    statistics {
        gamesTotal
        eventsTotal
        ratingsTotal
        commentsTotal
        years {
            year
            events
            eventsRaw
            newGames
            ratings
            importedRatings
            averageRating
            bands
        }
    }
}
