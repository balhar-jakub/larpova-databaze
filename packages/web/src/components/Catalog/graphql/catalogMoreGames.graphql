#import "src/components/Catalog/graphql/catalogGameData.graphql"

query CatalogMoreGames($filter: GameCatalogFilter, $order: GameCatalogOrder, $offset: Int!, $limit: Int!) {
    games {
        catalog(filter: $filter, order: $order, offset: $offset, limit: $limit) {
            totalAmount
            games {
                ...catalogGameData
            }
        }
    }
}
