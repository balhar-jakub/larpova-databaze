name: Deploy to Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    # The gate for the manual production deploy: the same suites the `Test`
    # workflow runs have to pass before the build is copied to the server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csld
          POSTGRES_PASSWORD: csld
          POSTGRES_DB: csld
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Corepack (Yarn 1)
        run: corepack enable && corepack prepare yarn@1 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Push DB schema (api)
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
        run: npx prisma db push --accept-data-loss
      - name: Push DB schema (web)
        working-directory: packages/web
        env:
          DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
        run: npx prisma db push --accept-data-loss
      - name: Run API tests
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
          NODE_OPTIONS: --experimental-vm-modules
          TZ: Europe/Prague
        run: yarn test
      - name: Run Web tests
        working-directory: packages/web
        env:
          DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
          NODE_OPTIONS: --experimental-vm-modules
          TZ: Europe/Prague
        run: yarn test
      - name: Build production .next
        working-directory: packages/web
        env:
          # NEXT_PUBLIC_* is inlined into the client bundle at build time, so the
          # measurement id has to be here and not in the server's .env. Unset secret
          # = analytics stays off (the app renders no gtag script).
          NEXT_PUBLIC_GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
        run: NODE_ENV=production yarn build
      - name: Deploy to production server
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-avz --delete --exclude=.env --exclude=node_modules"
          SOURCE: packages/web/
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: /home/balda/larpova-databaze/csld-new/
          # Phase 1: keep SESSION_SECRET in the production .env (same file the
          # app already reads DATABASE_URL from; the deploy exports it before
          # starting the server). rsync never touches .env.
          SCRIPT_BEFORE: |
            export PATH=/usr/local/lib/heroku/bin:/usr/local/lib/heroku/node_modules/.bin:$PATH
            cd /home/balda/larpova-databaze/csld-new
            if grep -q "^SESSION_SECRET=" .env 2>/dev/null; then
              sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=${{ secrets.SESSION_SECRET }}/" .env
            else
              printf "SESSION_SECRET=%s\n" "${{ secrets.SESSION_SECRET }}" >> .env
            fi
            for pid in $(pgrep -f "tsx.*server\.ts" 2>/dev/null); do
              cwd=$(readlink -f /proc/$pid/cwd 2>/dev/null)
              if echo "$cwd" | grep -q "csld-new"; then kill "$pid" 2>/dev/null; fi
            done
            PID=$(ss -tlnp 2>/dev/null | grep ':8080' | sed -n 's/.*pid=\([0-9]*\).*/\1/p')
            [ -n "$PID" ] && kill "$PID" 2>/dev/null
            sleep 2
          # The database is synced with `prisma db push`, which refuses to run when
          # it would drop something the schema no longer knows about unless
          # --accept-data-loss is passed. Without the flag the push failed, the
          # script carried on and the app started against a stale schema — which is
          # how a deploy that reported success broke the game detail and calendar
          # pages. So: print the drift, dump the database first, push with the flag,
          # and fail the run when the push did not go through.
          SCRIPT_AFTER: |
            export PATH=/usr/local/lib/heroku/bin:/usr/local/lib/heroku/node_modules/.bin:$PATH
            cd /home/balda/larpova-databaze/csld-new
            # node_modules is excluded from the rsync, so refresh it here —
            # otherwise a Next major bump ships a .next build the stale
            # node_modules/next cannot load.
            yarn install --frozen-lockfile
            # The app reads DATABASE_URL from .env through Next; prisma and pg_dump
            # need it in the shell environment.
            set -a; . ./.env; set +a
            npx prisma generate --schema prisma/schema.prisma

            echo '=== schema drift (database -> prisma/schema.prisma) ==='
            npx prisma migrate diff --from-url "$DATABASE_URL" \
              --to-schema-datamodel prisma/schema.prisma --script || true
            echo '=== end of drift ==='

            # /usr/bin/pg_dump is a wrapper that insists on the exact server
            # version being installed ("PostgreSQL version 16 is not installed");
            # a newer client dumps an older server happily, so prefer the newest
            # versioned binary and treat a missing dump as a warning, not a stop.
            PG_DUMP=''
            for candidate in /usr/lib/postgresql/*/bin/pg_dump pg_dump; do
              if [ -x "$candidate" ]; then PG_DUMP="$candidate"; fi
            done
            mkdir -p /home/balda/larpova-databaze/backups
            BACKUP=/home/balda/larpova-databaze/backups/csld-before-$(date +%Y%m%d-%H%M%S).sql
            if [ -n "$PG_DUMP" ] && "$PG_DUMP" "$DATABASE_URL" > "$BACKUP" 2>/tmp/pg_dump.err && [ -s "$BACKUP" ]; then
              echo "backup written: $BACKUP ($(du -h "$BACKUP" | cut -f1))"
            else
              echo 'WARNING: could not take a dump, continuing:' >&2
              head -3 /tmp/pg_dump.err >&2 || true
            fi

            PUSH_STATUS=0
            npx prisma db push --accept-data-loss --schema prisma/schema.prisma || PUSH_STATUS=$?

            PORT=8080 NODE_ENV=production setsid nohup npx tsx server.ts > /tmp/csld-new.log 2>&1 < /dev/null &
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error http://localhost:8080/health; then break; fi
              sleep 2
            done
            echo
            if [ "$PUSH_STATUS" -ne 0 ]; then
              echo "prisma db push failed (exit $PUSH_STATUS) — the database is NOT in sync with the schema" >&2
              exit 1
            fi
            echo 'production is up and the schema is in sync'
      # easingthemes/ssh-deploy prints "Remote script failed" as a warning and still
      # reports the step as successful, which is how a deploy that broke the site
      # went green. This step is the actual gate: it fails the run when the app is
      # not healthy or the database still differs from schema.prisma.
      - name: Verify production health and schema
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            export PATH=/usr/local/lib/heroku/bin:/usr/local/lib/heroku/node_modules/.bin:$PATH
            cd /home/balda/larpova-databaze/csld-new
            set -a; . ./.env; set +a
            curl --fail --silent --show-error http://localhost:8080/health
            echo
            # A synced database still prints the comment "-- This is an empty
            # migration.", so only non-comment lines count as drift.
            DRIFT=$(npx prisma migrate diff --from-url "$DATABASE_URL" \
              --to-schema-datamodel prisma/schema.prisma --script \
              | grep -v '^--' | grep -v '^[[:space:]]*$' || true)
            if [ -n "$DRIFT" ]; then
              echo 'schema is still out of sync after the push:' >&2
              echo "$DRIFT" >&2
              exit 1
            fi
            echo 'production is healthy and the database matches schema.prisma'
          REMOTE
