name: Quality gate (W1)

# Local code-quality gate (SPEC W1): complexity, duplication, churn hotspots
# over a 90-day window. Separate job so it never doubles the test matrix,
# never needs the databases, and its report is archived on every run.
# FAIL conditions apply to NEW code only (functions last touched inside the
# window; untracked files count as new) — legacy is report-only (ratchet).
#
# Rollout per SPEC W6: first two weeks report-only (continue-on-error),
# then flip to blocking by deleting the continue-on-error line.
# NOTE: complexity for TS/JS is a keyword approximation (~approx) in the
# local script; authoritative numbers come from a linter/Sonar in CI (W2+).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Code-quality gate (window 90d)
    runs-on: ubuntu-latest
    # Report-only phase (SPEC W6): a red gate does not block the PR yet.
    # Delete this line at the end of the two-week report-only period.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history for churn/blame/last-touch (the gate reads git log).
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run quality gate
        run: |
          python3 scripts/repo_quality_gate.py . \
            --thresholds scripts/repo-quality-thresholds.toml \
            --window-days 90 \
            --json quality-gate.json \
            --report quality-gate.md
          echo "exit_code=$?" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: |
            quality-gate.json
            quality-gate.md
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## Code-quality gate"
            echo '```'
            cat quality-gate.md || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
