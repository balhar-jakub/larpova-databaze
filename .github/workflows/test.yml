name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  monorepo-tests:
    name: API + Web tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csld
          POSTGRES_PASSWORD: csld
          POSTGRES_DB: csld
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
      NODE_OPTIONS: --experimental-vm-modules
      TZ: Europe/Prague

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn 1)
        run: corepack enable && corepack prepare yarn@1 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Push DB schema (web)
        working-directory: packages/web
        run: npx prisma db push --accept-data-loss

      - name: Run Web tests
        working-directory: packages/web
        run: yarn test

      - name: Run Web API-copy tests (the live tree — phase 3 consolidation)
        working-directory: packages/web
        run: yarn test:api
        # Phase 3: packages/api is gone; this suite is the ONLY API suite and
        # the server runs this very tree (packages/web/server.ts imports it),
        # so a red here is a real regression, not drift documentation.
