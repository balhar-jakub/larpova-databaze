name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Code-quality gate (W1, window 90d)
    runs-on: ubuntu-latest
    # W4 2026-10-27: the gate is BLOCKING. The report-only period ran 13.-27. 10.
    # (PRs #137-#141); the complexity frontier is registered in
    # [justifications] with written reasons, so a FAIL means exactly one
    # thing: a NEW unjustified violation. Warns do not block.
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate reads git history (churn, blame, last-touch): full depth.
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run quality gate
        # New code (functions last touched inside the 90d window, untracked
        # files) is gated; legacy is report-only (ratchet). TS/JS complexity
        # is a keyword approximation (~approx); authoritative numbers come
        # from a linter/Sonar step (W2). Thresholds live in the TOML —
        # values change only via calibration (W4).
        run: |
          python3 scripts/repo_quality_gate.py . \
            --thresholds scripts/repo-quality-thresholds.toml \
            --window-days 90 \
            --json quality-gate.json \
            --report quality-gate.md
      - name: Archive gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: |
            quality-gate.json
            quality-gate.md
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          {
            echo "## Code-quality gate (blocking)"
            echo '```'
            cat quality-gate.md || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  monorepo-tests:
    name: API + Web tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is what the deployment box runs; 26 is the current Node LTS line
        # (and what the box is expected to be upgraded to). Both must stay
        # green so the upgrade is a no-event.
        node-version: ['22', '26']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csld
          POSTGRES_PASSWORD: csld
          POSTGRES_DB: csld
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Shadow database for `prisma migrate diff --from-migrations`: Prisma
      # replays the migrations into it and drops/recreates its content, so
      # it must NOT be the database the tests run against.
      postgres-shadow:
        image: postgres:16
        env:
          POSTGRES_USER: csld
          POSTGRES_PASSWORD: csld
          POSTGRES_DB: csld_shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
      NODE_OPTIONS: --experimental-vm-modules
      TZ: Europe/Prague

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack (Yarn 1)
        if: matrix.node-version != '26'
        run: corepack enable && corepack prepare yarn@1 --activate

      # Node 25+ no longer bundles corepack — install Yarn 1 directly there.
      - name: Install Yarn 1 (Node 25+ has no corepack)
        if: matrix.node-version == '26'
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Generate GraphQL operation types (codegen)
        # The generated file is gitignored (phase 6): every fresh checkout
        # regenerates it from schema.graphql + the *.graphql documents, which
        # also proves the committed schema copy is not stale.
        working-directory: packages/web
        run: yarn codegen

      - name: Type check (hard gate — tsc --noEmit must be zero)
        # Phase 4: the count ratchet is retired at zero (PR #111, 201 → 0);
        # from here a NEW tsc error is a red build, exactly like a red test.
        # Note: `next build` ignores type errors, so this gate is the only
        # thing that keeps them out of main.
        working-directory: packages/web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (hard gate — eslint must be zero, whole repo)
        # W3: the production baseline was driven to zero (PR #137, #138),
        # then the test wave too (169 findings → 0: no-explicit-any 90,
        # no-unused-vars 55, no-unused-collection 10). From here a NEW
        # eslint error fails the build — the rule set and its exceptions
        # are in packages/web/eslint.config.mjs (every disabled rule
        # carries a comment).
        working-directory: packages/web
        run: yarn lint

      - name: Apply DB migrations (web)
        # Migrations are the reviewable DB change record (prisma/migrations);
        # applying them on a clean container also proves a fresh database
        # can reach the expected schema — a migration that assumes data
        # that must not exist yet fails here, in the PR, not on production.
        working-directory: packages/web
        run: npx prisma migrate deploy

      - name: Migrations must match schema.prisma
        # The guard: schema.prisma and prisma/migrations must agree, or a
        # schema change without a migration slips through review and the
        # first drift appears on the production deploy. Any non-comment
        # line means they disagree — fail the PR.
        working-directory: packages/web
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://csld:csld@localhost:5433/csld_shadow \
            --script > /tmp/migration_drift.sql
          if grep -v '^--' /tmp/migration_drift.sql | grep -q .; then
            echo 'schema.prisma and prisma/migrations have drifted:' >&2
            cat /tmp/migration_drift.sql >&2
            exit 1
          fi
          echo 'migrations match schema.prisma'

      - name: Run Web tests
        working-directory: packages/web
        run: yarn test

      - name: Run Web API-copy tests (the live tree — phase 3 consolidation)
        working-directory: packages/web
        run: yarn test:api
        # Phase 3: packages/api is gone; this suite is the ONLY API suite and
        # the server runs this very tree (packages/web/server.ts imports it),
        # so a red here is a real regression, not drift documentation.

      - name: Coverage ratchet (per-file floors + suite branch gate)
        # Phase 4: a coverage drop is a regression like a red test — a probe
        # deleted or an untested path regained. The line baseline
        # (scripts/coverage-ratchet-baseline.json) holds per-file line floors;
        # the branch baseline (scripts/coverage-ratchet-branch-baseline.json)
        # holds the suite-level branch targets (the ≥90% branch plan's gate)
        # plus informational per-file branch numbers. Refresh both ONLY on a
        # green main with
        #   node scripts/coverage-ratchet.mjs --update-baseline
        # and review that line floors and suite targets only went UP.
        env:
          DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
          NODE_OPTIONS: --experimental-vm-modules
          TZ: Europe/Prague
        run: node scripts/coverage-ratchet.mjs
