name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  monorepo-tests:
    name: API + Web tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # '20' is the current production runtime; '26' is the version the
        # deployment machine is being upgraded to. Both must stay green.
        node-version: ['20', '26']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csld
          POSTGRES_PASSWORD: csld
          POSTGRES_DB: csld
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
      NODE_OPTIONS: --experimental-vm-modules
      TZ: Europe/Prague

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Corepack is no longer bundled with Node 25+, so `corepack enable`
      # fails on the Node 26 leg. Install Yarn 1 directly instead.
      - name: Install Yarn 1
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Push DB schema (api)
        working-directory: packages/api
        run: npx prisma db push --accept-data-loss

      - name: Push DB schema (web)
        working-directory: packages/web
        run: npx prisma db push --accept-data-loss

      - name: Run API tests
        working-directory: packages/api
        run: yarn test

      - name: Run Web tests
        working-directory: packages/web
        run: yarn test
