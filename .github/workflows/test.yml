name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  monorepo-tests:
    name: API + Web tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csld
          POSTGRES_PASSWORD: csld
          POSTGRES_DB: csld
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
      NODE_OPTIONS: --experimental-vm-modules

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn 1)
        run: corepack enable && corepack prepare yarn@1 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Push DB schema (api)
        working-directory: packages/api
        run: npx prisma db push --accept-data-loss

      - name: Push DB schema (web)
        working-directory: packages/web
        run: npx prisma db push --accept-data-loss

      - name: Run API tests
        working-directory: packages/api
        run: yarn test

      - name: Run Web tests
        working-directory: packages/web
        run: yarn test

  csld-react-tests:
    name: csld-react tests
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn 1)
        run: corepack enable && corepack prepare yarn@1 --activate

      - name: Install dependencies
        working-directory: csld-react
        run: yarn install --frozen-lockfile

      - name: Run csld-react tests
        working-directory: csld-react
        run: yarn test
