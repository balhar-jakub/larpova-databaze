name: Deploy to Test

on:
  push:
    branches: [main]

# Both deploy workflows share one concurrency group: they mutate the same
# box (~/.cache/yarn, two .env files, two app dirs) and racing them produced
# the three red Deploy-to-Test runs on 2026-10-20. A queued deploy waits
# for the running one instead. cancel-in-progress must stay false on BOTH:
# with a shared group, a workflow's cancel-in-progress applies to whatever
# is running in the group — true here would let a push cancel a production
# deploy mid-flight.
concurrency:
  group: csld-box-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Test
    runs-on: ubuntu-latest

    # A deploy must not run on a red suite: the API and web tests are executed
    # here, before anything is built or copied to the server. The separate
    # `Test` workflow reports the same suites, but both workflows start on the
    # same push, so it cannot gate this one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csld
          POSTGRES_PASSWORD: csld
          POSTGRES_DB: csld
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack (Yarn 1)
        run: corepack enable && corepack prepare yarn@1 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Generate GraphQL operation types (codegen)
        # The generated file is gitignored (phase 6): regenerate it on every
        # fresh checkout so the .next build has the types it imports.
        working-directory: packages/web
        run: yarn codegen
      - name: Apply DB migrations (web)
        # Migrations are the reviewable DB change record (prisma/migrations);
        # applying them on a clean container proves a fresh database can
        # reach the expected schema before anything ships.
        working-directory: packages/web
        env:
          DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
        run: npx prisma migrate deploy
      - name: Run Web tests
        working-directory: packages/web
        env:
          DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
          NODE_OPTIONS: --experimental-vm-modules
          TZ: Europe/Prague
        run: yarn test
      - name: Build production .next
        working-directory: packages/web
        run: NODE_ENV=production yarn build
      - name: Configure deploy SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Stop current test application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            # Phase 6: under systemd, killing the process just triggers the
            # Restart=always supervision — the unit must be stopped first.
            systemctl --user stop csld-test.service 2>/dev/null || true
            for pid in $(pgrep -f "tsx.*server\.ts" 2>/dev/null); do
              cwd=$(readlink -f /proc/$pid/cwd 2>/dev/null)
              if echo "$cwd" | grep -q "/csld-test$"; then kill "$pid" 2>/dev/null || true; fi
            done
          '

      - name: Install SESSION_SECRET into the test .env
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            cd /home/balda/larpova-databaze/csld-test
            if grep -q "^SESSION_SECRET=" .env 2>/dev/null; then
              sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=${{ secrets.SESSION_SECRET }}/" .env
            else
              printf "SESSION_SECRET=%s\n" "${{ secrets.SESSION_SECRET }}" >> .env
            fi
            # Google sign-in: written only when the repo secret exists, so a deploy
            # without credentials leaves the feature inert (the button hides itself)
            # instead of shipping an empty client id. The redirect URI is not a
            # secret and differs per instance, so it is set here.
            if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
              if grep -q "^GOOGLE_CLIENT_ID=" .env 2>/dev/null; then
                sed -i "s|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}|" .env
              else
                printf "GOOGLE_CLIENT_ID=%s\n" "${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
              fi
              if grep -q "^GOOGLE_CLIENT_SECRET=" .env 2>/dev/null; then
                sed -i "s|^GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}|" .env
              else
                printf "GOOGLE_CLIENT_SECRET=%s\n" "${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
              fi
              if grep -q "^GOOGLE_REDIRECT_URI=" .env 2>/dev/null; then
                sed -i "s|^GOOGLE_REDIRECT_URI=.*|GOOGLE_REDIRECT_URI=https://csld.vezlute.cz/auth/google/callback|" .env
              else
                printf "GOOGLE_REDIRECT_URI=%s\n" "https://csld.vezlute.cz/auth/google/callback" >> .env
              fi
            fi
          '

      - name: Synchronize test application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -avz --delete --exclude=.env --exclude=node_modules \
            -e 'ssh -o BatchMode=yes' \
            packages/web/ "$SSH_USER@$SSH_HOST:/home/balda/larpova-databaze/csld-test/"

      - name: Start and verify test application on port 8082
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            export PATH=/usr/local/lib/heroku/bin:/usr/local/lib/heroku/node_modules/.bin:$PATH
            cd /home/balda/larpova-databaze/csld-test
            # node_modules is excluded from the rsync above, so it must be
            # refreshed here — otherwise a Next major bump ships a fresh .next
            # build that the stale node_modules/next cannot load (Next 15 build
            # + Next 14 runtime = missing font-manifest.json).
            yarn install --frozen-lockfile
            # yarn 1's offline cache stores the tarball of every package in
            # yarn.lock (~3 GB for this repo), and the box's 30 GB disk runs
            # ~88% full — without this line every deploy grows ~/.cache/yarn
            # until the disk fills. Pure cache: the next install repopulates it.
            rm -rf ~/.cache/yarn
            npx prisma generate --schema prisma/schema.prisma

            # A dump before the migrations, same as production takes: the
            # test database shares the instance with production, and a bad
            # migration must be recoverable. Prisma loads the DATABASE_URL
            # from its own .env discovery itself; for pg_dump we read it the
            # same way Prisma does — from the .env in the package root when
            # present. Best-effort: a missing dump must not stop the deploy
            # (the warning is loud, prod takes its own dump).
            PG_DUMP=''
            for candidate in /usr/lib/postgresql/*/bin/pg_dump pg_dump; do
              if [ -x "$candidate" ]; then PG_DUMP="$candidate"; fi
            done
            mkdir -p /home/balda/larpova-databaze/backups
            BACKUP=/home/balda/larpova-databaze/backups/csld-test-before-$(date +%Y%m%d-%H%M%S).sql
            if [ -n "$PG_DUMP" ] && [ -n "${DATABASE_URL:-}" ] && "$PG_DUMP" "${DATABASE_URL}" > "$BACKUP" 2>/tmp/pg_dump.err && [ -s "$BACKUP" ]; then
              echo "test backup written: $BACKUP ($(du -h "$BACKUP" | cut -f1))"
            else
              echo 'WARNING: could not take a dump, continuing:' >&2
              head -3 /tmp/pg_dump.err >&2 || true
            fi

            # Migrations are the reviewable DB change record (prisma/migrations);
            # `migrate deploy` applies the pending ones in order, once each,
            # tracked in _prisma_migrations. A failed migration stops the
            # deploy instead of leaving a half-applied schema.
            # ── Apply DB migrations ──
            # Baseline adoption: the test database's tables predate the
            # migration history, so on the very first run `0_init` would
            # fail with "table already exists". When the database has no
            # migration history yet, mark the baseline as applied and let
            # `migrate deploy` apply everything after it. Idempotent:
            # once _prisma_migrations has the baseline, this is a no-op.
            if ! npx prisma migrate resolve --applied 0_init >/dev/null 2>&1; then
              echo 'note: 0_init resolve failed (already recorded or not the first run) — continuing with migrate deploy'
            fi

            MIGRATE_STATUS=0
            npx prisma migrate deploy --schema prisma/schema.prisma || MIGRATE_STATUS=$?
            # The session secret gate (phase 1) requires SESSION_SECRET in the
            # environment; .env carries it, and the systemd unit loads it via
            # EnvironmentFile.

            # ── Phase 6: systemd supervision with Restart=always ──
            # Prefer the systemd user unit; fall back to nohup only when the
            # box has no working user systemd (e.g. no lingering).
            SYSTEMD_OK=yes
            systemctl --user daemon-reload 2>/dev/null || SYSTEMD_OK=no
            if [ "$SYSTEMD_OK" = yes ]; then
              bash scripts/install-systemd.sh test
              systemctl --user restart csld-test.service
              sleep 2
            else
              echo 'user systemd unavailable — falling back to nohup'
              # .env carries SESSION_SECRET (the session secret gate in
              # server.ts throws without it). The original db-push flow
              # never needed DATABASE_URL here — server.ts's API layer
              # resolves its own env files — so only source what exists.
              set -a
              [ -f .env ] && . ./.env
              set +a
              nohup env PORT=8082 NODE_ENV=production npx tsx server.ts > /tmp/csld-test.log 2>&1 < /dev/null &
            fi

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8082/health; then
                break
              fi
              sleep 2
            done
            if ! curl --fail --silent --show-error http://127.0.0.1:8082/health >/dev/null; then
              printf '%s\n' 'Test application did not become healthy on port 8082.' >&2
              journalctl --user -u csld-test.service -n 100 --no-pager >&2 2>/dev/null || tail -n 100 /tmp/csld-test.log >&2 || true
              exit 1
            fi
            if [ "$MIGRATE_STATUS" -ne 0 ]; then
              echo "prisma migrate deploy failed (exit $MIGRATE_STATUS) — the database may be out of sync with schema.prisma" >&2
              exit 1
            fi
            echo 'test is up and the migrations are applied'

            # ── Recovery proof: kill -9 must be survived via systemd ──
            if [ "$SYSTEMD_OK" = yes ]; then
              MAINPID=$(systemctl --user show csld-test.service -p MainPID --value)
              if [ -n "$MAINPID" ] && [ "$MAINPID" != 0 ]; then
                kill -9 "$MAINPID"
                # systemd waits RestartSec=5, then tsx boots the app — poll
                # for up to 60s instead of a fixed sleep that races the boot.
                RECOVERED=no
                for attempt in $(seq 1 30); do
                  sleep 2
                  if curl --fail --silent --show-error http://127.0.0.1:8082/health >/dev/null 2>&1; then
                    RECOVERED=yes
                    break
                  fi
                done
                if [ "$RECOVERED" != yes ]; then
                  printf '%s\n' 'systemd did NOT restart the app after kill -9 — supervision is broken' >&2
                  exit 1
                fi
                echo 'recovery check passed: app survived kill -9 (systemd Restart=always)'
              fi
            fi
          REMOTE
