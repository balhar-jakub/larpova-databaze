name: Deploy to Test

on:
  push:
    branches: [main]

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Corepack (Yarn 1)
        run: corepack enable && corepack prepare yarn@1 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build production .next
        working-directory: packages/web
        run: NODE_ENV=production yarn build
      - name: Deploy to test server
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-avz --delete --exclude=.env --exclude=node_modules"
          SOURCE: packages/web/
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: /home/balda/larpova-databaze/csld-test/
          SCRIPT_BEFORE: |
            export PATH=/usr/local/lib/heroku/bin:/usr/local/lib/heroku/node_modules/.bin:$PATH
            for pid in $(pgrep -f "tsx.*server\.ts" 2>/dev/null); do
              cwd=$(readlink -f /proc/$pid/cwd 2>/dev/null)
              if echo "$cwd" | grep -q "csld-test"; then kill "$pid" 2>/dev/null; fi
            done
            PID=$(ss -tlnp 2>/dev/null | grep ':8082' | sed -n 's/.*pid=\([0-9]*\).*/\1/p')
            [ -n "$PID" ] && kill "$PID" 2>/dev/null
            sleep 2
          SCRIPT_AFTER: |
            export PATH=/usr/local/lib/heroku/bin:/usr/local/lib/heroku/node_modules/.bin:$PATH
            cd /home/balda/larpova-databaze/csld-test
            npx prisma generate --schema prisma/schema.prisma
            npx prisma db push --schema prisma/schema.prisma
            PORT=8082 NODE_ENV=production setsid nohup npx tsx server.ts > /tmp/csld-test.log 2>&1 < /dev/null &
            sleep 5
            curl --fail --silent --show-error http://localhost:8082/health
