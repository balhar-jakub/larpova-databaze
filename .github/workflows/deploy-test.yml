name: Deploy to Test

on:
  push:
    branches: [main]

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Test
    runs-on: ubuntu-latest

    # A deploy must not run on a red suite: the API and web tests are executed
    # here, before anything is built or copied to the server. The separate
    # `Test` workflow reports the same suites, but both workflows start on the
    # same push, so it cannot gate this one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csld
          POSTGRES_PASSWORD: csld
          POSTGRES_DB: csld
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack (Yarn 1)
        run: corepack enable && corepack prepare yarn@1 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Generate GraphQL operation types (codegen)
        # The generated file is gitignored (phase 6): regenerate it on every
        # fresh checkout so the .next build has the types it imports.
        working-directory: packages/web
        run: yarn codegen
      - name: Push DB schema (web)
        working-directory: packages/web
        env:
          DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
        run: npx prisma db push --accept-data-loss
      - name: Run Web tests
        working-directory: packages/web
        env:
          DATABASE_URL: postgresql://csld:csld@localhost:5432/csld
          NODE_OPTIONS: --experimental-vm-modules
          TZ: Europe/Prague
        run: yarn test
      - name: Build production .next
        working-directory: packages/web
        run: NODE_ENV=production yarn build
      - name: Configure deploy SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Stop current test application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            for pid in $(pgrep -f "tsx.*server\.ts" 2>/dev/null); do
              cwd=$(readlink -f /proc/$pid/cwd 2>/dev/null)
              if echo "$cwd" | grep -q "/csld-test$"; then kill "$pid" 2>/dev/null || true; fi
            done
          '

      - name: Install SESSION_SECRET into the test .env
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            cd /home/balda/larpova-databaze/csld-test
            if grep -q "^SESSION_SECRET=" .env 2>/dev/null; then
              sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=${{ secrets.SESSION_SECRET }}/" .env
            else
              printf "SESSION_SECRET=%s\n" "${{ secrets.SESSION_SECRET }}" >> .env
            fi
          '

      - name: Synchronize test application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -avz --delete --exclude=.env --exclude=node_modules \
            -e 'ssh -o BatchMode=yes' \
            packages/web/ "$SSH_USER@$SSH_HOST:/home/balda/larpova-databaze/csld-test/"

      - name: Start and verify test application on port 8082
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            export PATH=/usr/local/lib/heroku/bin:/usr/local/lib/heroku/node_modules/.bin:$PATH
            cd /home/balda/larpova-databaze/csld-test
            # node_modules is excluded from the rsync above, so it must be
            # refreshed here — otherwise a Next major bump ships a fresh .next
            # build that the stale node_modules/next cannot load (Next 15 build
            # + Next 14 runtime = missing font-manifest.json).
            yarn install --frozen-lockfile
            npx prisma generate --schema prisma/schema.prisma
            npx prisma db push --schema prisma/schema.prisma
            # The session secret gate (phase 1) requires SESSION_SECRET in the
            # environment; .env carries it, and the systemd unit loads it via
            # EnvironmentFile.

            # ── Phase 6: systemd supervision with Restart=always ──
            # Prefer the systemd user unit; fall back to nohup only when the
            # box has no working user systemd (e.g. no lingering).
            SYSTEMD_OK=yes
            systemctl --user daemon-reload 2>/dev/null || SYSTEMD_OK=no
            if [ "$SYSTEMD_OK" = yes ]; then
              bash scripts/install-systemd.sh test
              systemctl --user restart csld-test.service
              sleep 2
            else
              echo 'user systemd unavailable — falling back to nohup'
              set -a; . ./.env; set +a
              nohup env PORT=8082 NODE_ENV=production npx tsx server.ts > /tmp/csld-test.log 2>&1 < /dev/null &
            fi

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8082/health; then
                break
              fi
              sleep 2
            done
            if ! curl --fail --silent --show-error http://127.0.0.1:8082/health >/dev/null; then
              printf '%s\n' 'Test application did not become healthy on port 8082.' >&2
              journalctl --user -u csld-test.service -n 100 --no-pager >&2 2>/dev/null || tail -n 100 /tmp/csld-test.log >&2 || true
              exit 1
            fi

            # ── Recovery proof: kill -9 must be survived via systemd ──
            if [ "$SYSTEMD_OK" = yes ]; then
              MAINPID=$(systemctl --user show csld-test.service -p MainPID --value)
              if [ -n "$MAINPID" ] && [ "$MAINPID" != 0 ]; then
                kill -9 "$MAINPID"
                sleep 8
                if ! curl --fail --silent --show-error http://127.0.0.1:8082/health >/dev/null; then
                  printf '%s\n' 'systemd did NOT restart the app after kill -9 — supervision is broken' >&2
                  exit 1
                fi
                echo 'recovery check passed: app survived kill -9 (systemd Restart=always)'
              fi
            fi
          REMOTE
